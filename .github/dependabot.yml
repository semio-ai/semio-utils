version: 2
# One pull request a week carries every npm and GitHub Actions update this file allows,
# so a library's updates are reviewed, tested and merged together. An update that
# breaks holds the whole pull request: fix it on the pull request's branch, or add an
# ignore rule below with its reason.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    # A published range changes only when a new version falls outside it, so a routine
    # update moves only the lockfile and neither consumers nor Studio's mount follow it.
    versioning-strategy: increase-if-necessary
    # Security updates are not scheduled: each time alerts have fixes, one pull request
    # carries all of them.
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    # Studio mounts this library as an npm workspace and shares one installed copy of
    # each dependency and tool with it, so a major version moves in Studio and its
    # libraries together, by hand. The rule also stops a security update that needs a
    # major; the Dependabot alert still opens, because alerts come from the dependency
    # graph and dependabot.yml does not affect them.
    #
    # Some updates that are not majors break the same way, so they also move with Studio:
    # - eslint-plugin-tailwindcss: Studio lints each mounted library with its own copy,
    #   4.0.0-beta.0, whose `flat/recommended` config the stable 4.x releases drop, so
    #   the plugin and the libraries' ESLint config move with Studio's.
    # - typescript-eslint: Studio lints each mounted library with its own copy too, and
    #   its minor releases change what rules report (8.72's `no-shadow` flags
    #   `const X = memo(function X() {})`), so a library's code passes the version Studio
    #   runs and moves to a newer one together with Studio.
    # - Tailwind: Studio builds each mounted library's CSS with its own copy, and minor
    #   releases change the CSS it emits (4.3 serializes achromatic colours as
    #   `oklch(L 0 none)`, which ui's appearance and parity tests compare).
    # - three and its types: three versions as 0.x, so a minor release breaks, and a
    #   library declaring a newer minor installs a second copy beside Studio's.
    # - radix-ui minors: ui allows only releases below 1.6, because 1.6 and 1.7 change
    #   how its toast menu and disabled Select options behave. A newer minor waits until
    #   ui works with it.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-plugin-tailwindcss
      - dependency-name: typescript-eslint
      - dependency-name: tailwindcss
      - dependency-name: "@tailwindcss/*"
      - dependency-name: three
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/three"
        update-types: ["version-update:semver-minor"]
      - dependency-name: radix-ui
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    ignore:
      # changesets/action 2 refuses Changesets CLI 2 and renames the inputs release.yml
      # passes, so the action, the CLI and the release harness move together.
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
